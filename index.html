<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NikitaYoutubeArchive</title>
  <style>
    :root {
      --bg-color: #0d0607;
      --card-bg: rgba(30, 10, 12, 0.6);
      --accent-color: #e63946;
      --accent-hover: #ff4d5a;
      --text-color: #f1faee;
      --text-muted: #a8a2a4;
      --border-color: rgba(230, 57, 70, 0.2);
      --glass-border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(230, 57, 70, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(120, 15, 25, 0.2) 0%, transparent 50%);
      background-attachment: fixed;
    }

    header {
      background: rgba(15, 5, 7, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 1rem 2rem;
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-color);
      text-decoration: none;
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--accent-color), #800f19);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(230, 57, 70, 0.4);
      font-size: 1.2rem;
    }

    .uptime-badge {
      background: rgba(230, 57, 70, 0.1);
      border: 1px solid var(--border-color);
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .uptime-badge span {
      color: var(--accent-color);
      font-weight: 600;
    }

    .btn {
      background: rgba(230, 57, 70, 0.15);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .btn:hover {
      background: var(--accent-color);
      border-color: var(--accent-color);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(230, 57, 70, 0.3);
    }

    main {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      flex: 1;
      width: 100%;
    }

    /* Tag Filters */
    .filter-section {
      margin-bottom: 2rem;
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border: 1px solid var(--glass-border);
      padding: 1rem 1.25rem;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .filter-title {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .tag-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tag-btn:hover, .tag-btn.active {
      background: var(--accent-color);
      color: #fff;
      border-color: var(--accent-color);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--border-color);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), 0 0 15px rgba(230, 57, 70, 0.2);
    }

    .card-image-wrap {
      width: 100%;
      height: 220px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.3);
      cursor: pointer;
      position: relative;
    }

    .card-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card:hover .card-image {
      transform: scale(1.05);
    }

    .card-content {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex: 1;
    }

    .card-caption {
      font-size: 0.95rem;
      line-height: 1.4;
      color: var(--text-color);
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: auto;
      padding-top: 0.5rem;
    }

    .inline-tag {
      font-size: 0.75rem;
      color: var(--accent-color);
      background: rgba(230, 57, 70, 0.1);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px dashed var(--border-color);
      margin: 2rem 0;
    }

    /* Modal / Lightbox / Clicker Styles */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 1rem;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #14080a;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      max-width: 500px;
      width: 100%;
      padding: 1.5rem;
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .modal-close:hover {
      color: var(--accent-color);
    }

    /* Clicker Game Specifics */
    .clicker-modal {
      text-align: center;
    }

    .clicker-title {
      font-size: 1.5rem;
      color: var(--accent-color);
      margin-bottom: 0.5rem;
    }

    .clicker-score {
      font-size: 2.2rem;
      font-weight: 800;
      margin: 0.8rem 0;
      color: #fff;
      text-shadow: 0 0 10px rgba(230, 57, 70, 0.5);
    }

    .click-target {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-color), #800f19);
      border: 4px solid rgba(255, 255, 255, 0.2);
      margin: 0 auto 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      cursor: pointer;
      user-select: none;
      transition: transform 0.05s ease, box-shadow 0.2s ease;
      box-shadow: 0 0 20px rgba(230, 57, 70, 0.4);
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }

    .click-target:active {
      transform: scale(0.92);
      box-shadow: 0 0 30px rgba(230, 57, 70, 0.8);
    }

    .clicker-upgrades {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1.2rem;
    }

    .upgrade-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      padding: 0.75rem;
      border-radius: 10px;
      color: var(--text-color);
      cursor: pointer;
      font-size: 0.85rem;
      text-align: left;
    }

    .upgrade-btn:hover:not(:disabled) {
      border-color: var(--accent-color);
      background: rgba(230, 57, 70, 0.1);
    }

    .upgrade-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .data-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* Lightbox */
    .lightbox-img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 8px;
      object-fit: contain;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      margin-top: auto;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <a href="#" class="logo">
        <div class="logo-icon">📷</div>
        <span>NikitaYoutubeArchive</span>
      </a>

      <div class="uptime-badge">
        Сайт выживает: <span id="uptime-counter">0д 0ч 0м 0с</span>
      </div>
    </div>
  </header>

  <main>
    <div class="filter-section">
      <div class="filter-title">Фильтр по тегам:</div>
      <div class="tags-container" id="tags-filter">
        <button class="tag-btn active" data-tag="all">Все теги</button>
      </div>
    </div>

    <div id="gallery-grid" class="gallery-grid"></div>
    <div id="empty-state" class="empty-state" style="display: none;">
      <h3>Упс... пока что тут ничего нет...</h3>
      <p style="color: var(--text-muted); margin-top: 0.5rem;">Ждем пока админ загрузит хотя бы одно фото.</p>
    </div>
  </main>

  <!-- Lightbox Modal -->
  <div class="modal-overlay" id="lightbox-modal">
    <button class="modal-close" id="lightbox-close">&times;</button>
    <img src="" alt="" class="lightbox-img" id="lightbox-img">
  </div>

  <!-- Clicker Game Modal -->
  <div class="modal-overlay" id="clicker-modal">
    <div class="modal-card clicker-modal">
      <button class="modal-close" id="clicker-close">&times;</button>
      <div class="clicker-title">NikitaYoutubeClicker</div>
      <p style="color: var(--text-muted); font-size: 0.85rem;">Тайный режим кликера</p>
      
      <div class="clicker-score" id="clicker-score">0</div>

      <div class="click-target" id="click-target">🎬</div>

      <div class="clicker-upgrades">
        <button class="upgrade-btn" id="upg-click">
          <strong>+1 к клику</strong><br>
          <span style="color: var(--text-muted);">Цена: <span id="cost-click">10</span></span>
        </button>
        <button class="upgrade-btn" id="upg-auto">
          <strong>+1 в сек (Авто)</strong><br>
          <span style="color: var(--text-muted);">Цена: <span id="cost-auto">50</span></span>
        </button>
      </div>

      <div class="data-actions">
        <button class="btn" id="change-skin-btn">🎨 Скин</button>
        <button class="btn" id="export-btn">💾 Экспорт</button>
        <button class="btn" id="import-btn">📥 Импорт</button>
        <input type="file" id="import-file" accept=".json" style="display: none;">
      </div>
    </div>
  </div>

  <footer>
    NikitaYoutubeArchive &copy; <span id="year"></span>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // === 1. UPTIME COUNTER (Отсчет с секундами от 23.10.2026) ===
    const START_DATE = new Date('2026-10-23T00:00:00');

    function updateUptime() {
      const now = new Date();
      const diff = Math.max(0, now - START_DATE);

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById('uptime-counter').textContent = `${days}д ${hours}ч ${minutes}м ${seconds}с`;
    }
    setInterval(updateUptime, 1000);
    updateUptime();

    // === 2. GALLERY & HASHTAGS ===
    let allPhotos = [];
    let currentTag = 'all';

    async function loadGallery() {
      try {
        const res = await fetch('./data.json');
        if (!res.ok) throw new Error();
        allPhotos = await res.json();
        renderTagsFilter();
        renderGallery();
      } catch (e) {
        document.getElementById('gallery-grid').style.display = 'none';
        document.getElementById('empty-state').style.display = 'block';
      }
    }

    function extractTags(item) {
      const tags = new Set(item.tags || []);
      if (item.caption) {
        const matches = item.caption.match(/#[a-zA-Zа-яА-Я0-9_]+/g);
        if (matches) {
          matches.forEach(t => tags.add(t.replace('#', '')));
        }
      }
      return Array.from(tags);
    }

    function renderTagsFilter() {
      const tagSet = new Set();
      allPhotos.forEach(item => {
        extractTags(item).forEach(tag => tagSet.add(tag));
      });

      const container = document.getElementById('tags-filter');
      container.innerHTML = '<button class="tag-btn active" data-tag="all">Все теги</button>';

      tagSet.forEach(tag => {
        const btn = document.createElement('button');
        btn.className = 'tag-btn';
        btn.dataset.tag = tag;
        btn.textContent = `#${tag}`;
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentTag = tag;
          renderGallery();
        });
        container.appendChild(btn);
      });

      container.querySelector('[data-tag="all"]').addEventListener('click', (e) => {
        document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentTag = 'all';
        renderGallery();
      });
    }

    function renderGallery() {
      const grid = document.getElementById('gallery-grid');
      grid.innerHTML = '';

      const filtered = allPhotos.filter(item => {
        if (currentTag === 'all') return true;
        return extractTags(item).includes(currentTag);
      });

      if (filtered.length === 0) {
        document.getElementById('empty-state').style.display = 'block';
        return;
      } else {
        document.getElementById('empty-state').style.display = 'none';
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';

        const tags = extractTags(item);
        const tagsHtml = tags.map(t => `<span class="inline-tag">#${t}</span>`).join(' ');

        card.innerHTML = `
          <div class="card-image-wrap">
            <img src="${item.url}" alt="Photo" class="card-image" loading="lazy">
          </div>
          <div class="card-content">
            <div class="card-caption">${item.caption || ''}</div>
            <div class="card-tags">${tagsHtml}</div>
          </div>
        `;

        card.querySelector('.card-image-wrap').addEventListener('click', () => {
          document.getElementById('lightbox-img').src = item.url;
          document.getElementById('lightbox-modal').classList.add('active');
        });

        grid.appendChild(card);
      });
    }

    // Lightbox close
    document.getElementById('lightbox-close').addEventListener('click', () => {
      document.getElementById('lightbox-modal').classList.remove('active');
    });

    // === 3. SECRET CLICKER + CUSTOM SKIN ===
    let game = {
      score: 0,
      clickPower: 1,
      autoPower: 0,
      costClick: 10,
      costAuto: 50,
      skinUrl: ''
    };

    function loadGame() {
      const saved = localStorage.getItem('nikita_clicker_save');
      if (saved) {
        try { Object.assign(game, JSON.parse(saved)); } catch(e) {}
      }
      updateClickerUI();
    }

    function saveGame() {
      localStorage.setItem('nikita_clicker_save', JSON.stringify(game));
    }

    function updateClickerUI() {
      document.getElementById('clicker-score').textContent = Math.floor(game.score);
      document.getElementById('cost-click').textContent = game.costClick;
      document.getElementById('cost-auto').textContent = game.costAuto;

      document.getElementById('upg-click').disabled = game.score < game.costClick;
      document.getElementById('upg-auto').disabled = game.score < game.costAuto;

      const target = document.getElementById('click-target');
      if (game.skinUrl) {
        target.style.backgroundImage = `url('${game.skinUrl}')`;
        target.textContent = '';
      } else {
        target.style.backgroundImage = 'none';
        target.textContent = '🎬';
      }
    }

    // Target Click
    document.getElementById('click-target').addEventListener('click', () => {
      game.score += game.clickPower;
      saveGame();
      updateClickerUI();
    });

    // Upgrades
    document.getElementById('upg-click').addEventListener('click', () => {
      if (game.score >= game.costClick) {
        game.score -= game.costClick;
        game.clickPower += 1;
        game.costClick = Math.floor(game.costClick * 1.5);
        saveGame();
        updateClickerUI();
      }
    });

    document.getElementById('upg-auto').addEventListener('click', () => {
      if (game.score >= game.costAuto) {
        game.score -= game.costAuto;
        game.autoPower += 1;
        game.costAuto = Math.floor(game.costAuto * 1.6);
        saveGame();
        updateClickerUI();
      }
    });

    // Change Skin
    document.getElementById('change-skin-btn').addEventListener('click', () => {
      const url = prompt('Введи ссылку на изображение для скина (или оставь пустым для сброса):', game.skinUrl || '');
      if (url !== null) {
        game.skinUrl = url.trim();
        saveGame();
        updateClickerUI();
      }
    });

    // Auto clicker loop
    setInterval(() => {
      if (game.autoPower > 0) {
        game.score += game.autoPower;
        saveGame();
        updateClickerUI();
      }
    }, 1000);

    // Export / Import
    document.getElementById('export-btn').addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(game));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = `nikita_clicker_save.json`;
      a.click();
    });

    document.getElementById('import-btn').addEventListener('click', () => {
      document.getElementById('import-file').click();
    });

    document.getElementById('import-file').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (typeof imported.score === 'number') {
            game = imported;
            saveGame();
            updateClickerUI();
            alert('Прогресс успешно загружен!');
          }
        } catch (err) {
          alert('Ошибка чтения файла сохранения!');
        }
      };
      reader.readAsText(file);
    });

    // Clicker Modal Controls
    const clickerModal = document.getElementById('clicker-modal');
    
    function openClicker() {
      clickerModal.classList.add('active');
    }
    
    function closeClicker() {
      clickerModal.classList.remove('active');
    }

    document.getElementById('clicker-close').addEventListener('click', closeClicker);

    // Hotkey Y / Н
    window.addEventListener('keydown', (e) => {
      if (e.key === 'y' || e.key === 'Y' || e.key === 'н' || e.key === 'Н') {
        if (clickerModal.classList.contains('active')) {
          closeClicker();
        } else {
          openClicker();
        }
      }
    });

    // Init
    loadGallery();
    loadGame();
  </script>
</body>
</html>
